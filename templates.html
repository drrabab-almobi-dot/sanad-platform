<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القوالب — سند</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --primary: #00453d; --primary-container: #075e54; --secondary: #006b5f;
    --bg: #f4f6f5; --border: #e3e8e6; --text: #101917; --text-muted: #5c6b67;
    --error: #ba1a1a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Cairo','Segoe UI',sans-serif; background: var(--bg); color: var(--text); }
  .topbar {
    background: #fff; border-bottom: 1px solid var(--border); padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .brand { font-size: 18px; font-weight: 800; color: var(--primary); }
  .brand a { color: inherit; text-decoration: none; }
  .nav-links { display: flex; gap: 16px; font-size: 13px; flex-wrap: wrap; }
  .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; }
  .nav-links a.active { color: var(--primary); }
  main { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

  .add-form {
    background: #fff; border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; margin-bottom: 24px;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: var(--text-muted); }
  .field input, .field textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    font-family: inherit; font-size: 14px; resize: vertical;
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--primary); }
  button.add-btn {
    padding: 11px 22px; border-radius: 8px; border: none; background: var(--primary);
    color: #fff; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  button.add-btn:hover { background: var(--primary-container); }
  button.add-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .tpl-card {
    background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px;
  }
  .tpl-card .name { font-weight: 800; font-size: 14px; margin-bottom: 8px; }
  .tpl-card .body { font-size: 13px; color: var(--text-muted); white-space: pre-wrap; line-height: 1.6; margin-bottom: 12px; }
  button.del-btn {
    background: none; border: none; color: var(--error); cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700;
  }
  .empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
  .msg { margin-top: 12px; font-size: 13px; padding: 8px 12px; border-radius: 8px; display: none; }
  .msg.error { display: block; background: #fdecea; color: var(--error); }
  .loading { text-align: center; padding: 60px 0; color: var(--text-muted); }
</style>
</head>
<body>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="brand"><a href="dashboard.html">🟢 سند</a></div>
    <div class="nav-links">
      <a href="dashboard.html">لوحة التحكم</a>
      <a href="contacts.html">جهات الاتصال</a>
      <a href="templates.html" class="active">القوالب</a>
      <a href="campaigns.html">الحملات</a>
      <a href="whatsapp-connect.html">ربط واتساب</a>
      <a href="account-settings.html">الإعدادات</a>
    </div>
  </div>

  <main>
    <h1>قوالب الرسائل</h1>
    <div class="sub">أنشئي قوالب رسائل جاهزة لاستخدامها في حملاتك — محفوظة فعليًا في قاعدة البيانات.</div>

    <form class="add-form" id="addForm">
      <div class="field">
        <label>اسم القالب</label>
        <input id="tplName" type="text" placeholder="مثال: ترحيب بعميل جديد" required>
      </div>
      <div class="field">
        <label>محتوى الرسالة</label>
        <textarea id="tplBody" rows="4" placeholder="اكتبي نص الرسالة هنا..." required></textarea>
      </div>
      <button type="submit" class="add-btn" id="addBtn">إضافة القالب</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="tpl-grid" id="tplGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">لا يوجد قوالب بعد — أضيفي أول قالب بالأعلى.</div>
  </main>
</div>

<div class="loading" id="loadingBox">جاري التحميل...</div>

<script src="supabase-config.js"></script>
<script>
  let ORG_ID = null;

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s ?? '';
    return d.innerHTML;
  }

  async function loadTemplates() {
    const { data, error } = await window.sanadSupabase
      .from('templates')
      .select('id, name, body, created_at')
      .eq('organization_id', ORG_ID)
      .order('created_at', { ascending: false });

    const grid = document.getElementById('tplGrid');
    const empty = document.getElementById('emptyState');

    if (error) { console.error(error); return; }

    if (!data || data.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }

    empty.style.display = 'none';
    grid.innerHTML = data.map(t => `
      <div class="tpl-card">
        <div class="name">${esc(t.name)}</div>
        <div class="body">${esc(t.body)}</div>
        <button class="del-btn" data-id="${t.id}">حذف</button>
      </div>
    `).join('');

    grid.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('حذف هذا القالب؟')) return;
        await window.sanadSupabase.from('templates').delete().eq('id', btn.dataset.id);
        loadTemplates();
      });
    });
  }

  (async () => {
    const { data: { session } } = await window.sanadSupabase.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    const { data: profile } = await window.sanadSupabase
      .from('profiles').select('organization_id').eq('id', session.user.id).single();

    ORG_ID = profile?.organization_id;
    if (!ORG_ID) return;

    await loadTemplates();

    document.getElementById('loadingBox').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  })();

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('addBtn');
    const msg = document.getElementById('msg');
    msg.className = 'msg';
    btn.disabled = true;
    btn.textContent = 'جاري الإضافة...';

    const name = document.getElementById('tplName').value.trim();
    const body = document.getElementById('tplBody').value.trim();

    const { error } = await window.sanadSupabase.from('templates').insert({
      organization_id: ORG_ID,
      name,
      body
    });

    if (error) {
      msg.textContent = 'حدث خطأ: ' + error.message;
      msg.className = 'msg error';
    } else {
      document.getElementById('tplName').value = '';
      document.getElementById('tplBody').value = '';
      await loadTemplates();
    }

    btn.disabled = false;
    btn.textContent = 'إضافة القالب';
  });
</script>
</body>
</html>
