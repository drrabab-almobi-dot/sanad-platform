<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعدادات — سند</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --primary: #00453d; --primary-container: #075e54; --secondary: #006b5f;
    --bg: #f4f6f5; --border: #e3e8e6; --text: #101917; --text-muted: #5c6b67;
    --error: #ba1a1a; --success: #1e7e34;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Cairo','Segoe UI',sans-serif; background: var(--bg); color: var(--text); }
  .topbar {
    background: #fff; border-bottom: 1px solid var(--border); padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .brand { font-size: 18px; font-weight: 800; color: var(--primary); }
  .brand a { color: inherit; text-decoration: none; }
  .nav-links { display: flex; gap: 16px; font-size: 13px; flex-wrap: wrap; }
  .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; }
  .nav-links a.active { color: var(--primary); }
  main { max-width: 560px; margin: 0 auto; padding: 32px 24px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

  .card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 20px; }
  .card h2 { font-size: 15px; margin: 0 0 16px; }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); font-family: inherit; font-size: 14px; }
  input:focus { outline: none; border-color: var(--primary); }
  input[disabled] { background: #f4f6f5; color: var(--text-muted); }
  button.save-btn {
    margin-top: 18px; padding: 11px 24px; border-radius: 10px; border: none;
    background: var(--primary); color: #fff; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  button.save-btn:hover { background: var(--primary-container); }
  button.save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .plan-badge {
    display: inline-block; background: #e6f0ee; color: var(--primary); font-size: 12px;
    font-weight: 700; padding: 3px 10px; border-radius: 999px;
  }
  .msg { margin-top: 14px; font-size: 13px; padding: 8px 12px; border-radius: 8px; display: none; }
  .msg.error { display: block; background: #fdecea; color: var(--error); }
  .msg.success { display: block; background: #e6f4ea; color: var(--success); }
  .loading { text-align: center; padding: 60px 0; color: var(--text-muted); }
</style>
</head>
<body>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="brand"><a href="dashboard.html">🟢 سند</a></div>
    <div class="nav-links">
      <a href="dashboard.html">لوحة التحكم</a>
      <a href="contacts.html">جهات الاتصال</a>
      <a href="templates.html">القوالب</a>
      <a href="campaigns.html">الحملات</a>
      <a href="whatsapp-connect.html">ربط واتساب</a>
      <a href="account-settings.html" class="active">الإعدادات</a>
    </div>
  </div>

  <main>
    <h1>إعدادات الحساب</h1>
    <div class="sub">إدارة معلومات مؤسستك وملفك الشخصي.</div>

    <div class="card">
      <h2>معلومات المؤسسة</h2>
      <label>اسم المؤسسة / المتجر</label>
      <input id="orgNameInput" type="text" required>
      <label>الخطة الحالية</label>
      <div style="margin-top:6px;"><span class="plan-badge" id="planBadge">—</span></div>
    </div>

    <div class="card">
      <h2>ملفي الشخصي</h2>
      <label>الاسم الكامل</label>
      <input id="fullNameInput" type="text" required>
      <label>البريد الإلكتروني</label>
      <input id="emailInput" type="email" disabled>
      <button class="save-btn" id="saveBtn">حفظ التغييرات</button>
      <div class="msg" id="msg"></div>
    </div>
  </main>
</div>

<div class="loading" id="loadingBox">جاري التحميل...</div>

<script src="supabase-config.js"></script>
<script>
  let ORG_ID = null;

  (async () => {
    const { data: { session } } = await window.sanadSupabase.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    const user = session.user;

    const { data: profile } = await window.sanadSupabase
      .from('profiles')
      .select('full_name, organization_id, organizations ( name, plan )')
      .eq('id', user.id)
      .single();

    ORG_ID = profile?.organization_id;

    document.getElementById('orgNameInput').value = profile?.organizations?.name || '';
    document.getElementById('fullNameInput').value = profile?.full_name || '';
    document.getElementById('emailInput').value = user.email;
    const plan = profile?.organizations?.plan || 'trial';
    document.getElementById('planBadge').textContent = plan === 'trial' ? 'تجريبي' : plan === 'pro' ? 'احترافي' : plan;

    document.getElementById('loadingBox').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  })();

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const btn = document.getElementById('saveBtn');
    const msg = document.getElementById('msg');
    msg.className = 'msg';
    btn.disabled = true;
    btn.textContent = 'جاري الحفظ...';

    const orgName = document.getElementById('orgNameInput').value.trim();
    const fullName = document.getElementById('fullNameInput').value.trim();
    const { data: { session } } = await window.sanadSupabase.auth.getSession();

    const [r1, r2] = await Promise.all([
      window.sanadSupabase.from('organizations').update({ name: orgName }).eq('id', ORG_ID),
      window.sanadSupabase.from('profiles').update({ full_name: fullName }).eq('id', session.user.id)
    ]);

    if (r1.error || r2.error) {
      msg.textContent = 'حدث خطأ: ' + (r1.error?.message || r2.error?.message);
      msg.className = 'msg error';
    } else {
      msg.textContent = 'تم حفظ التغييرات بنجاح ✅';
      msg.className = 'msg success';
    }

    btn.disabled = false;
    btn.textContent = 'حفظ التغييرات';
  });
</script>
</body>
</html>
