<style>
  :root {
    --primary: #00453d;

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Cairo', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  .app {
    display: flex;
    height: 100vh;
  }
  .sidebar {
    width: 300px;

    background: var(--sidebar-bg);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .sidebar-header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    font-size: 20px;
    font-weight: 800;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .nav-group-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 16px 20px 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: right;
    padding: 10px 20px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    border-right: 3px solid transparent;
    transition: background 0.15s, border-color 0.15s;
  }
  .nav-item:hover { background: #f0f4f3; }
  .nav-item.active {
    background: #e6f0ee;
    border-right-color: var(--primary);
    font-weight: 600;
    color: var(--primary);
  }
  .nav-num {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    min-width: 20px;
  }
  .nav-item.active .nav-num { color: var(--primary); }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .topbar {
    height: 56px;
    min-height: 56px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
  }
  .topbar-title {
    font-size: 15px;
    font-weight: 700;
  }
  .topbar-count {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .frame-wrap {
    flex: 1;
    background: #eef1f0;
    padding: 16px;
    overflow: hidden;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
  }
  @media (max-width: 900px) {
    .sidebar { width: 220px; min-width: 220px; }
  }
</style>

class=\"relative pt-24 pb-32 overflow-hidden\">\n<div class=\"max-w-7xl mx-auto px-margin-desktop relative z-10 text-center\">\n<h1 class=\"font-display-lg text-display-lg text-on-surface mb-6 max-w-4xl mx-auto leading-tight\">\n                تواصل بذكاء، نمِّ أعمالك بسرعة\n            </h1>\n<p class=\"font-body-lg text-body-lg text-on-surface-variant mb-10 max-w-2xl mx-auto\">سند هي المنصة الشاملة لإدارة تسويق واتساب وخدمة العملاء. اجمع فريقك في مكان واحد وتواصل مع عملائك بفعالية واحترافية.</p>\n<div class=\"flex flex-col sm:flex-row justify-center items-center gap-4\">\n<button class=\"bg-primary text-on-primary px-8 py-4 rounded font-body-lg text-body-lg font-semibold hover:bg-on-primary-fixed-variant transition-colors w-full sm:w-auto\">\n                    ابدأ مجاناً\n                </button>\n<button class=\"border border-secondary text-secondary px-8 py-4 rounded font-body-lg text-body-lg font-semibold hover:bg-surface-container-low transition-colors w-full sm:w-auto flex items-center justify-center gap-2\">\n<span class=\"material-symbols-outlined\" data-icon=\"play_circle\">play_circle</span>\n                    مشاهدة العرض\n                </button>\n</div>\n</div>\n<!-- Decorative background elements -->\n<div class=\"absolute top-0 right-0 w-1/2 h-full bg-gradient-to-l from-primary-fixed/20 to-transparent -z-10 rounded-l-full blur-3xl opacity-50 transform translate-x-1/4 -translate-y-1/4\"></div>\n<div class=\"absolute bottom-0 left-0 w-1/3 h-1/2 bg-gradient-to-tr from-secondary-fixed/20 to-transparent -z-10 rounded-tr-full blur-3xl opacity-50 transform -translate-x-1/4 translate-y-1/4\"></div>\n</section>\n<!-- About / Platform Introduction -->\n<section class=\"py-20 bg-surface-container-low\">\n<div class=\"max-w-5xl mx-auto px-margin-desktop text-center\">\n<span class=\"inline-flex items-center gap-2 bg-primary-container text-on-primary-container rounded-full px-5 py-2 text-label-md font-label-md font-semibold mb-6\">\n<span class=\"material d text-label-md text-on-surface-variant\" for=\"campaign-name\">اسم الحملة</label>\n<input class=\"w-full border border-outline-variant rounded-lg p-sm focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none bg-surface transition-colors font-body-md text-body-md text-on-background\" id=\"campaign-name\" name=\"campaign_name\" placeholder=\"مثال: عروض نهاية العام\" type=\"text\"/>\n</div>\n<div class=\"flex flex-col gap-xs\">\n<label class=\"font-label-md text-label-md text-on-surface-variant\" for=\"target-audience\">الجمهور المستهدف (القائمة)</label>\n<select class=\"w-full border border-outline-variant rounded-lg p-sm focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none bg-surface transition-colors font-body-md text-body-md text-on-background appearance-none\" id=\"target-audience\" name=\"target_audience\">\n<option value=\"vip\">عملاء VIP (1,200 جهة اتصال)</option>\n<option value=\"new\">المشتركون الجدد (350 جهة اتصال)</option>\n<option value=\"all\">جميع العملاء (5,000 جهة اتصال)</option>\n</select>\n</div>\n</div>\n</fieldset>\n<!-- Message Composer Card -->\n<!-- Form section for message content and attachments -->\n<fieldset class=\"bg-surface-container-lowest border border-outline-variant rounded-xl p-lg flex flex-col gap-md mb-lg\">\n<div class=\"flex justify-between items-center border-b border-outline-variant pb-sm\">\n<legend class=\"font-title-lg text-title-lg text-on-background m-0\">محتوى الرسالة</legend>\n<!-- Toolbar for message composer -->\n<div class=\"flex gap-sm\">\n<button class=\"w-8 h-8 flex items-center justify-center rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-colors\" id=\"btn-add-variable\" title=\"إضافة متغير\" type=\"button\">\n<span class=\"material-symbols-outlined text-[20px]\" data-icon=\"data_object\">data_object</span>\n</button>\n<button class=\"w-8 h-8 flex items-center justify-center rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-colors\" id=\"btn-add-emoji\" title=\"إضافة إيموجي\" type=\"button\">\n<span class=\"material-symbols-outlined text-[20px]\" data-icon=\"sentiment_satisfied\">sentiment_satisfied</span>\n</button>\n</div>\n</div>\n<div class=\"relative\">\n<textarea class=\"w-full h-48 border border-outline-variant rounded-lg p-md focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none bg-surface transition-colors font-body-md text-body-md text-on-background resize-none\" id=\"message-input\" name=\"message_content\" placeholder=\"اكتب رسالتك هنا... استخدم [الاسم] لإضافة اسم العميل ديناميكياً.\"></textarea>\n<div class=\"absolute bottom-md left-md font-label-md text-label-md text-outline\">\n<span class=\"\" id=\"char-count\">0</span> / 1024\n                    </div>\n</div>\n<!-- Media Upload -->\n<!-- Section for uploading files -->\n<div>\n<label class=\"font-label-md text-label-md text-on-surface-variant block mb-sm\">المرفقات (اختياري)</label>\n<div class=\"border-2 border-dashed border-outline-variant rounded-lg p-lg flex flex-col items-center justify-center gap-sm bg-surface hover:bg-surface-container-low transition-colors cursor-pointer\" id=\"media-upload-area\">\n<input class=\"hidden\" id=\"file-upload\" multiple=\"\" name=\"attachments[]\" type=\"file\"/>\n<span class=\"material-symbols-outlined text-[32px] text-outline\" data-icon=\"cloud_upload\">cloud_upload</span>\n<span class=\"font-body-md text-body-md text-on-surface-variant\">اسحب وأفلت الصور أو الملفات هنا</span>\n<span class=\"font-label-md text-label-md text-outline\">أو انقر للاستعراض (Max 5MB)</span>\n</div>\n</div>\n</fieldset>\n<!-- Schedule Card -->\n<!-- Form section for scheduling the campaign -->\n<fieldset class=\"bg-surface-container-lowest border border-outline-variant rounded-xl p-lg\">\n<legend class=\"font-title-lg text-title-lg text-on-background mb-md border-b border-outline-variant pb-sm w-full text-right block\">جدولة الإرسال</legend>\n<div class=\"flex flex-col gap-sm\">\n<label class=\"flex items-center gap-sm cursor-pointer\" for=\"schedule-now\">\n<input checked=\"\" class=\"text-secondary focus:ring-secondary\" id=\"schedule-now\" name=\"schedule_type\" type=\"radio\" value=\"now\"/>\n<span class=\"font-body-md text-body-md text-on-background\">إرسال الآن</span>\n</label>\n<label class=\"flex items-center gap-sm cursor-pointer mt-sm\" for=\"schedule-later\">\n<input class=\"text-secondary focus:ring-secondary\" id=\"schedule-later\" name=\"schedule_type\" type=\"radio\" value=\"later\"/>\n<span class=\"font-body-md text-body-md text-on-background\">جدولة لوقت لاحق</span>\n</label>\n<!-- Scheduling Inputs (Date and Time) -->\n<div class=\"grid grid-cols-1 md:grid-cols-2 gap-gutter mt-sm opacity-50 pointer-events-none\" id=\"schedule-inputs\">\n<div class=\"flex flex-col gap-xs\">\n<label class=\"font-label-md text-label-md text-on-surface-variant\" for=\"schedule-date\">التاريخ</label>\n<input class=\"w-full border border-outline-variant rounded-lg p-sm focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none bg-surface transition-colors font-body-md text-body-md text-on-background\" id=\"schedule-date\" name=\"schedule_date\" type=\"date\"/>\n</div>\n<div class=\"flex flex-col gap-xs\">\n<label class=\"font-label-md text-label-md text-on-surface-variant\" for=\"schedule-time\">الوقت</label>\n<input class=\"w-full border border-outline-variant rounded-lg p-sm focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none bg-surface transition-colors font-body-md text-body-md text-on-background\" id=\"schedule-time\" name=\"schedule_time\" type=\"time\"/>\n</div>\n</div>\n</div>\n</fieldset>\n</form>\n</section>\n<!-- Right Column: Live Preview -->\n<!-- This section provides a live preview of the message -->\n<aside class=\"md:col-span-4 hidden md:block\">\n<div class=\"sticky top-24 bg-surface-container-lowest border border-outline-variant rounded-xl p-lg flex flex-col items-center h-[calc(100vh-8rem)]\">\n<h2 class=\"font-title-lg text-title-lg text-on-background w-full text-right mb-lg border-b border-outline-variant pb-sm\">معاينة الرسالة</h2>\n<!-- Phone Mockup -->\n<div class=\"w-[300px] h-[600px] border-[8px] border-surface-variant rounded-[40px] bg-[#EFEAE2] flex flex-col overflow-hidden relative shadow-md\" id=\"phone-mockup-preview\">\n<!-- Phone Header -->\n<div class=\"bg-[#075E54] text-white px-md py-sm flex items-center justify-between z-10 shadow-sm\">\n<div class=\"flex items-center gap-sm\">\n<span class=\"material-symbols-outlined text-[20px]\" data-icon=\"arrow_back\">arrow_back</span>\n<div class=\"w-8 h-8 bg-surface-variant rounded-full overflow-hidden\">\n<img class=\"w-full h-full object-cover\" data-alt=\"A small circular profile picture of a generic business logo in green and white, clean modern design\" src=\"https://lh3.googleusercontent.com/aida-public/AB6AXuAgsLhzON9GowcxCT8G4dBCstLuowRADYkdYMYNJbvhm9BVEjWU_T5OudEkaghTfrqmCSwmxKu3-IqxpvBjrAWw4_cKIvz1jT1ePskFbaaC7GYM2V3qOQzkVP8aGfUdXz7IG_Br6UDhFkehKZxwnrS3GD6vwmM2aySpRRwWV1Lr5CT1_YyBE_J2gCm_HvkNWk72UOSsqNMzQfLZ1EcRL4Tee0-PD7Z1ryYMqgd7ng_iPf0-tHfmqqizUA\"/>\n</div>\n<span class=\"font-label-md text-label-md truncate w-24 text-left font-semibold\">سند - send.sa.com</span>\n</div>\n<div class=\"flex items-center gap-xs\">\n<span class=\"material-symbols-outlined text-[18px]\" data-icon=\"videocam\">videocam</span>\n<span class=\"material-symbols-outlined text-[18px]\" data-icon=\"call\">call</span>\n<span class=\"material-symbols-outlined text-[18px]\" data-icon=\"more_vert\">more_vert</span>\n</div>\n</div>\n<!-- Chat Area -->\n<div class=\"flex-1 p-md flex flex-col justify-end bg-[#EFEAE2] relative\" data-alt=\"Subtle, pale, repeating geometric doodle pattern typical of messaging app backgrounds, very low opacity, light beige and grey tones.\" style=\"background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD27meJPdD4EWe51xuDb6oj_EG4lBuxGQwernuwxAZSdrwrmfE86tqknQjN-a8J7BzNrIY9DR66zKmV3c0GdMM0z6JsS32GT0Ny8L6lPvCg835yaS2GjEMhdw7aHm3Fl1GDIw6mJ7gtigbZmUMcEmyYs0IF0bwfQOqYzNOZvc_ri-EiJoiocmeXoOJZKuSLrIB6faEgiTsd4b2iENuAL8lBglCzoPn7kGqgyuiFqKB_77RQL9YaSuwMlg'); background-size: cover; background-position: center;\">\n<!-- Date Badge -->\n<div class=\"w-full flex justify-center mb-md\">\n<span class=\"bg-[#D9FDD3] px-sm py-xs rounded-lg font-label-md text-[10px] text-on-surface-variant shadow-sm text-center\">اليوم</span>\n</div>\n<!-- Message Bubble -->\n<div class=\"bg-white rounded-lg rounded-tr-none p-sm shadow-sm max-w-[85%] self-end relative mb-md border border-[#E2E8F0]\">\n<p class=\"font-body-md text-[13px] text-on-background leading-relaxed whitespace-pre-wrap\" id=\"preview-text\">مرحباً [الاسم]،\nهذه رسالة تجريبية لمعاينة كيف ستبدو حملتك على أجهزة العملاء. يمكنك تعديل النص في الحقل المجاور لترى التغييرات هنا مباشرة.</p>\n<div class=\"text-left mt-1 flex justify-end items-center gap-xs\">\n<span class=\"text-[10px] text-outline font-label-md\">10:42 ص</span>\n<span class=\"material-symbols-outlined text-[14px] text-outline\" data-icon=\"done_all\">done_all</span>\n</div>\n</div>\n</div>\n<!-- Input Area Dummy -->\n<div class=\"bg-surface p-sm flex items-center gap-sm border-t border-outline-variant\">\n<span class=\"material-symbols-outlined text-outline text-[20px]\" data-icon=\"add\">add</span>\n<div class=\"flex-1 bg-white rounded-full border border-outline-variant px-md py-xs text-outline font-body-md text-[13px]\">رسالة...</div>\n<div class=\"w-8 h-8 rounded-full bg-primary-container flex items-center justify-center\">\n<span class=\"material-symbols-outlined text-on-primary-container text-[18px]\" data-icon=\"mic\">mic</span>\n</div>\n</div>\n</div>\n</div>\n</aside>\n</main>\n<script>\n        // Simple script to update character count and preview\n        const input = document.getElementById('message-input');\n        const charCount = document.getElementById('char-count');\n        const preview = document.getElementById('preview-text');\n        \n        input.addEventListener('input', function() {\n            const length = this.value.length;\n            charCount.textContent = length;\n            if(length > 1000) {\n                charCount.classList.add('text-error');\n            } else {\n                charCount.classList.remove('text-error');\n            }\n            \n            preview.textContent = this.value || 'اكتب رسالتك لترى المعاينة هنا...';\n        });\n\n        // Schedule toggle logic\n        const scheduleRadios = document.querySelectorAll('input[name=\"schedule_type\"]');\n        const scheduleInputs = document.getElementById('schedule-inputs');\n\n        scheduleRadios.forEach(radio => {\n            radio.addEventListener('change', (e) => {\n                if(e.target.value === 'later') {\n                    scheduleInputs.classList.remove('opacity-50', 'pointer-events-none');\n                } else {\n                    scheduleInputs.classList.add('opacity-50', 'pointer-events-none');\n                }\n            });\n        });\n\n        // Trigger file input on click of media upload area\n        const uploadArea = document.getElementById('media-upload-area');\n        const fileInput = document.getElementById('file-upload');\n        if(uploadArea && fileInput) {\n             uploadArea.addEventListener('click', () => {\n                 fileInput.click();\n             });\n        }\n    <\/script>\n</body></html>", "group": "main"}, {"id": "campaign-logs", "label": "سجلات الحملات", "html": "<!DOCTYPE html>\n\n<html dir=\"rtl\" lang=\"ar\"><head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>سجلات الحملات - سند</title>\n<!-- Material Symbols -->\n<link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap\" rel=\"stylesheet\"/>\n<link href=\"https://fonts.googleapis.com/css2?famil iv>\n</section>\n<!-- Right Side: Connection Details Rail (الجانب الأيمن: تفاصيل وإعدادات الاتصال) -->\n<aside class=\"w-full md:w-[320px] flex-shrink-0 flex flex-col gap-gutter\" id=\"sidebar-details\">\n<!-- Connection Status Card (بطاقة حالة الاتصال) -->\n<div class=\"bg-surface-container-lowest border border-outline-variant rounded-xl p-md shadow-sm\" id=\"card-connection-status\">\n<div class=\"flex items-center gap-sm mb-md p-sm bg-secondary-container text-on-secondary-container rounded-lg border border-secondary/20\">\n<span class=\"material-symbols-outlined\">developer_mode</span>\n<div>\n<p class=\"font-label-md text-label-md font-bold\">جاهز للربط التقني مع واتساب</p>\n<p class=\"font-body-md text-body-md text-xs\">نظام API مفعل وجاهز للاستخدام</p>\n</div>\n</div>\n<h3 class=\"font-title-lg text-title-lg text-primary mb-md border-b border-outline-variant pb-sm\">حالة الاتصال</h3>\n<!-- Current Status indicator (مؤشر الحالة الحالي) -->\n<div class=\"flex items-center gap-sm mb-md p-sm bg-error-container text-on-error-container rounded-lg border border-error/20\" id=\"status-indicator-disconnected\">\n<span class=\"material-symbols-outlined\">link_off</span>\n<div>\n<p class=\"font-label-md text-label-md font-bold\">غير متصل</p>\n<p class=\"font-body-md text-body-md text-xs\">يرجى مسح الرمز المربع للبدء</p>\n</div>\n</div>\n<!-- Device Details List (قائمة تفاصيل الجهاز) -->\n<div class=\"space-y-sm mt-sm\">\n<div class=\"flex justify-between items-center py-xs border-b border-outline-variant/50 last:border-0\">\n<span class=\"font-body-md text-body-md text-on-surface-variant\">الرقم المتصل</span>\n<span class=\"font-body-md text-body-md text-on-surface font-medium dir-ltr\" id=\"detail-connected-number\">---</span>\n</div>\n<div class=\"flex justify-between items-center py-xs border-b border-outline-variant/50 last:border-0\">\n<span class=\"font-body-md text-body-md text-on-surface-variant\">اسم الجهاز</span>\n<span class=\"font-body-md text-body-md text-on disc list-outside mr-sm space-y-xs font-body-md text-body-md text-on-surface-variant\">\n<li class=\"\">تأكد من اتصال هاتفك الذكي بالإنترنت (Wi-Fi أو بيانات خلوية).</li>\n<li class=\"\">لا تغلق تطبيق واتساب على هاتفك بقوة.</li>\n<li class=\"\">لإرسال كميات كبيرة، يفضل إبقاء شاشة الهاتف قيد التشغيل في البداية.</li>\n</ul>\n</div>\n</aside>\n</main>\n<!-- BottomNavBar (Mobile Only) (شريط التنقل السفلي للموبايل) -->\n<nav class=\"md:hidden bg-surface dark:bg-surface-dim text-primary dark:text-primary-fixed-dim font-label-md text-label-md fixed bottom-0 w-full z-50 border-t border-outline-variant dark:border-outline flex flex-row-reverse justify-around items-center h-20 w-full pb-safe\" id=\"mobile-nav\">\n<a class=\"flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim active:scale-95 transition-transform w-1/4 h-full\" href=\"#\" id=\"mobile-nav-dashboard\">\n<span class=\"material-symbols-outlined mb-xs\" data-icon=\"dashboard\">dashboard</span>\n<span class=\"\">لوحة التحكم</span>\n</a>\n<a class=\"flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim active:scale-95 transition-transform w-1/4 h-full\" href=\"#\" id=\"mobile-nav-campaigns\">\n<span class=\"material-symbols-outlined mb-xs\" data-icon=\"campaign\">campaign</span>\n<span class=\"\">الحملات</span>\n</a>\n<a class=\"flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim active:scale-95 transition-transform w-1/4 h-full\" href=\"#\" id=\"mobile-nav-contacts\">\n<span class=\"material-symbols-outlined mb-xs\" data-icon=\"contacts\">contacts</span>\n<span class=\"\">جهات الاتصال</span>\n</a>\n<a class=\"flex flex-col items-center justify-center bg-secondary-container dark:bg-primary-container text-on-secondary-container dark:text-o ject-contain opacity-80\" data-alt=\"A clean, high-contrast, black and white QR code displayed squarely in the center of a minimalist light-themed interface. The QR code is sharp and prominent, designed for easy scanning. The surrounding background is a soft, pristine white, emphasizing the bold geometry of the code. The overall aesthetic is functional, modern, and aligned with enterprise software dashboards.\" src=\"https://lh3.googleusercontent.com/aida-public/AB6AXuA55fRDV3hVs7m_O6i8ZtRgrSrfZnMSjuEGi3dP3BAsLLXmigWcrNComE7Xrchd58XJWuwjGrv3jpZem5JaiNaR6hDw7FcPlGnfNstW9LFt_Vky23GEAFUB0dQgp9lv7x7OaN4jMq8VO1-AOpKySpjUof1l7x9PrIAzB2ZwRdM7p6zE8IRazjhQwRO6jnTIejgISo263n6OB3a79LLxeeXPj_KeitpBGVODvNskoYnx5YP5Sz2lh9uVgQ\"/>\n<button class=\"mt-4 flex items-center gap-2 text-primary font-label-md text-label-md hover:bg-surface-container-high px-4 py-2 rounded-lg transition-colors\">\n<span class=\"material-symbols-outlined text-[18px]\">refresh</span>\n                        تحديث الرمز\n                    </button>\n</div>\n<!-- Instructions -->\n<div class=\"flex-1 space-y-md\">\n<h3 class=\"font-title-lg text-title-lg text-on-surface\">خطوات الربط:</h3>\n<ol class=\"list-decimal list-inside space-y-sm font-body-lg text-on-surface-variant mr-2\">\n<li>افتح تطبيق <strong>واتساب</strong> على هاتفك.</li>\n<li>اضغط على القائمة (ثلاث نقاط) أو <strong>الإعدادات</strong>.</li>\n<li>اختر <strong>الأجهزة المرتبطة</strong> (Linked Devices).</li>\n<li>اضغط على زر <strong>ربط جهاز</strong> (Link a Device).</li>\n<li>وجّه كاميرا هاتفك نحو الشاشة لمسح الرمز أعلاه.</li>\n</ol>\n<div class=\"mt-lg p-md bg-surface-container-low rounded-lg border border-outline-variant/50\">\n<div class=\"flex items-start gap-sm\">\n<span class=\"material-symbols-outlined text-tertiary\">info</span>\n<p class=\"font-body-md text-on-surface-variant\">تأكد من بقاء هاتفك متصلاً بالإنترنت أثناء عملية الربط لضمان استقرار الاتصال لاحقاً.</p>\n</div>\n</div>\n</div>\n</div>\n<!-- Side Info / Current Device Detai tify-center bg-secondary-container dark:bg-primary-container text-on-secondary-container dark:text-on-primary-container rounded-full px-4 py-1 active:scale-95 transition-transform\" href=\"#\">\n<span class=\"material-symbols-outlined\" data-icon=\"settings\" data-weight=\"fill\" style=\"font-variation-settings: 'FILL' 1;\">settings</span>\n<span class=\"font-label-md text-label-md mt-1\">الإعدادات</span>\n</a>\n</div>\n</nav>\n</body></html>", "group": "mobile"}];
  const byId = Object.fromEntries(SCREENS.map(s => [s.id, s]));
  const mainScreens = SCREENS.filter(s => s.group === 'main');

  function selectScreen(id) {
    const s = byId[id];
    if (!s) return;
    document.getElementById('screenFrame').srcdoc = s.html;
    document.getElementById('screenTitle').textContent = s.label;
    const idx = mainScreens.findIndex(x => x.id === id);
    document.getElementById('screenCount').textContent = idx >= 0
      ? (idx + 1) + ' / ' + mainScreens.length
      : 'نسخة جوال';
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.id === id);
    });
  }

  selectScreen('landing-page');
